# Database configuration
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/finance_db


# Hibernate ORM settings
quarkus.hibernate-orm.dialect=org.hibernate.dialect.MySQLDialect
quarkus.hibernate-orm.log.sql=true
#quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.database.generation=update


# HTTP server configuration
quarkus.http.port=8080

# Logging configuration
quarkus.log.level=INFO

# OpenAPI configuration
quarkus.smallrye-openapi.info.title=IFG Test
quarkus.smallrye-openapi.info.version=1.0.0
quarkus.smallrye-openapi.path=/openapi

# External API configuration
exchange.api.url=https://v6.exchangerate-api.com/v6/{API_KEY}/latest
exchange.api.key=056e9b112d809df7894aa08b
